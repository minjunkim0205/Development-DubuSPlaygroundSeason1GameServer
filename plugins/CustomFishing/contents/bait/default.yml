# use Vanilla items as bait
BOOK:
  tag: false
  material: book
  requirements:
    requirement_1:
      type: rod
      value:
        - magical_rod
      not-met-actions:
        action_message:
          type: message
          value:
            - '이 미끼는 <#7B68EE>마법 낚싯대에만 사용할 수 있습니다'

simple_bait:
  material: paper
  display:
    name: '<b><#00BFFF>간단한 미끼'
    lore:
      - ''
      - '<#7FFFD4>설명:'
      - '<gray>천연 재료로 만들어져 물고기를'
      - '<gray>차분하고 안정적으로 끌어들입니다.'
      - '<gray>간단하고 믿을 수 있는 낚시 경험에 적합합니다.'
      - ''
      - '<#FFD700>효과:'
      - '<gray> - 낚시 난이도 감소'
      - ''
  custom-model-data: 50001
  effects:
    effect_1:
      type: difficulty
      value: -10

magnetic_bait:
  material: paper
  display:
    name: '<b><red>자<blue>석 <gray>미끼'
    lore:
      - ''
      - '<#7FFFD4>설명:'
      - '<gray>빛나는 반짝임과 독특한 에너지 파동으로'
      - '<gray>호기심 많은 물고기를 빠르게 끌어들입니다.'
      - ''
      - '<#FFD700>효과:'
      - '<gray> - 입질 대기 시간 감소'
      - '<gray> - 낚시 게임 시간 증가'
      - ''
  custom-model-data: 50002
  effects:
    effect_1:
      type: wait-time-multiplier
      value: 0.9
    effect_2:
      type: game-time
      value: 2

wild_bait:
  material: paper
  display:
    name: '<b><#2E8B57>야생 미끼'
    lore:
      - ''
      - '<#7FFFD4>설명:'
      - '<gray>두려움 없는 낚시꾼을 위해 만들어진 미끼입니다.'
      - '<gray>강력한 천연 재료의 향으로 큰 물고기를 유인합니다.'
      - ''
      - '<#FFD700>효과:'
      - '<gray> - 낚시 난이도 증가'
      - '<gray> - 잡히는 물고기 크기 증가'
      - ''
  custom-model-data: 50003
  effects:
    effect_1:
      type: difficulty
      value: +20
    effect_2:
      type: size-multiplier
      value: 1.5
    effect_3:
      type: game-time
      value: -2
