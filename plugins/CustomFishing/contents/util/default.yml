fishfinder:
  material: PAPER
  display:
    name: '<b><#1E90FF>어군 탐지기'
    lore:
      - ''
      - '<#7FFFD4>설명:'
      - '<gray> - 작지만 강력하게 물속을 탐지해'
      - '<gray> - 수면 아래 숨어 있는 다양한 어종을'
      - '<gray> - 확인할 수 있게 해 줍니다.'
      - ''
  custom-model-data: 50000
  events:
    interact:
      conditional_action:
        type: conditional
        value:
          conditions:
            condition_1:
              type: cooldown
              value:
                key: fishfinder
                time: 3000
              not-met-actions:
                action_1:
                  type: message
                  value:
                    - '잠시만요! 어군 탐지기를 너무 자주 사용하고 있습니다.'
          actions:
            action_1:
              type: fish-finder
              value:
                surrounding: water
                ignore-gears: true
water_effect:
  material: PAPER
  custom-model-data: 49998
lava_effect:
  material: PAPER
  custom-model-data: 49999
