# Note: These are the default configurations of the plugin
# and do not necessarily mean that players can have a good
# gaming experience. We hope that you will create
# customized configurations based on your own ideas,
# allowing players to experience the uniqueness of your server.

weekend_competition:
  # TOTAL_SCORE
  # CATCH_AMOUNT
  # MAX_SIZE
  # MIN_SIZE
  # TOTAL_SIZE
  # RANDOM
  goal: CATCH_AMOUNT

  # Optional
  # 1-7
  start-weekday:
    - 6
    - 7

  # Optional
  start-time:
    - '9:30'
    - '14:30'
    - '20:00'

  # Seconds
  duration: 300

  # Min players to start the competition
  min-players: 2
  skip-actions:
    broadcast:
      type: broadcast
      value:
        - '낚시 대회를 예정대로 시작하기에 플레이어 수가 부족합니다.'

  bossbar:
    enable: true
    color: WHITE
    overlay: PROGRESS
    text:
      - '<gray>[<#87CEFA>🎣<gray>] <gradient:#F0F8FF:#87CEFA:#F0F8FF>남은 시간: <#E6E6FA>{seconds}s <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>내 순위: <#E6E6FA>{rank} <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>1위 플레이어: <#E6E6FA>{1_player}'
      - '<gray>[<#87CEFA>🎣<gray>] <gradient:#F0F8FF:#87CEFA:#F0F8FF>남은 시간: <#E6E6FA>{minute}{second} <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>내 점수: <#E6E6FA>{score_formatted} <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>1위 점수: <#E6E6FA>{1_score}'
      - '<gray>[<#87CEFA>🎣<gray>] <gradient:#F0F8FF:#87CEFA:#F0F8FF>남은 시간: <#E6E6FA>{minute}{second} <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>승리 조건: <#E6E6FA>{goal}'
    refresh-rate: 20 # in ticks
    switch-interval: 200 # in ticks
    only-show-to-participants: true

  actionbar:
    enable: false
    text:
      - '<gradient:#F0F8FF:#87CEFA:#F0F8FF>남은 시간: <#E6E6FA>{seconds}s <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>내 순위: <#E6E6FA>{rank} <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>1위 플레이어: <#E6E6FA>{1_player}'
      - '<gradient:#F0F8FF:#87CEFA:#F0F8FF>남은 시간: <#E6E6FA>{minute}{second} <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>내 점수: <#E6E6FA>{score_formatted} <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>1위 점수: <#E6E6FA>{1_score}'
      - '<gradient:#F0F8FF:#87CEFA:#F0F8FF>남은 시간: <#E6E6FA>{minute}{second} <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>승리 조건: <#E6E6FA>{goal}'
    refresh-rate: 5 # in ticks
    switch-interval: 200 # in ticks
    only-show-to-participants: true

  # timely broadcast competition
  broadcast:
    enable: false
    text:
      - '<#D4F2E7>◤─────────────────────────◥'
      - ''
      - '             <gray>[<#87CEFA>🎣<gray>]  <gradient:#F0F8FF:#87CEFA:#F0F8FF>낚시 대회'
      - ''
      - '     <#E1FFFF>현재 순위:</#E1FFFF>'
      - '              <#E1FFFF>1위: {1_player} - {1_score}'
      - '              <#E1FFFF>2위: {2_player} - {2_score}'
      - '              <#E1FFFF>3위: {3_player} - {3_score}'
      - ''
      - '<#D4F2E7>◣─────────────────────────◢'
    interval: 1200 # in ticks

  start-actions:
    broadcast:
      type: broadcast
      value:
        - '<#D4F2E7>◤─────────────────────────◥'
        - ''
        - '             <gray>[<#87CEFA>🎣<gray>]  <gradient:#F0F8FF:#87CEFA:#F0F8FF>낚시 대회'
        - ''
        - '      <#E1FFFF>목표:'
        - '         <#B0C4DE>{goal}'
        - '           <#B0C4DE>낚시를 시작해 참가하세요!'
        - ''
        - '<#D4F2E7>◣─────────────────────────◢'
  end-actions:
    broadcast:
      type: broadcast
      value:
        - '<#D4F2E7>◤─────────────────────────◥'
        - ''
        - '             <gray>[<#87CEFA>🎣<gray>]  <gradient:#F0F8FF:#87CEFA:#F0F8FF>낚시 대회'
        - ''
        - '      <#E1FFFF>결과:'
        - '              <gradient:#FFF8DC:#FFD700:#FFF8DC>1위: {1_player} - {1_score}'
        - '              <gradient:#F5FFFA:#F5F5F5:#F5FFFA>2위: {2_player} - {2_score}'
        - '              <gradient:#D2B48C:#CD853F:#D2B48C>3위: {3_player} - {3_score}'
        - ''
        - '<#D4F2E7>◣─────────────────────────◢'
  participate-actions:
    message:
      type: message
      value:
        - '대회에 참가했습니다. 행운을 빕니다!'

  # Requirements for participating the competition
  participate-requirements: {}

  # Rewards
  rewards:
    1:
      command_action:
        type: command
        value:
          - 'money give {player} 200'
      messages_action:
        type: message
        value:
          - '<#FF4500>[1위] 축하합니다! 1등 보상을 받았습니다!'
    2:
      command_action:
        type: command
        value:
          - 'money give {player} 100'
      messages_action:
        type: message
        value:
          - '<#FF4500>[2위] 아쉽습니다! 다음 기회에 다시 도전하세요!'
    3:
      command_action:
        type: command
        value:
          - 'money give {player} 100'
      messages_action:
        type: message
        value:
          - '<#FF4500>[3위] 아쉽습니다! 다음 기회에 다시 도전하세요!'
    participation:
      command_action:
        type: command
        value:
          - 'money give {player} 10'
      messages_action:
        type: message
        value:
          - '<#FF4500>참가해 주셔서 감사합니다!'