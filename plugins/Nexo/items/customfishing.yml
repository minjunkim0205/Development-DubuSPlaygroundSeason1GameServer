beginner_rod:
  material: FISHING_ROD
  Mechanics:
    durability:
      value: 64
  Pack:
    model: customfishing:item/rod/beginner_rod
    cast_model: customfishing:item/rod/beginner_rod_cast
    custom_model_data: 50001
  displayname: <b><#EEE9E9>초보자 낚싯대
  lore:
  - ''
  - '<#7FFFD4>설명:'
  - '<gray> - 낚시를 처음 시작하는 사람을 위해 제작된'
  - <gray> - 초보 낚시꾼의 든든한 친구입니다.
  - ''
  - '<#FFD700>효과:'
  - <gray> - 입질 대기 시간 증가
  - <gray> - 낚시 난이도 감소
silver_rod:
  material: FISHING_ROD
  Mechanics:
    durability:
      value: 96
  Pack:
    model: customfishing:item/rod/silver_rod
    cast_model: customfishing:item/rod/silver_rod_cast
    custom_model_data: 50002
  displayname: <b><#C0C0C0>은빛 낚싯대
  lore:
  - ''
  - '<#7FFFD4>설명:'
  - <gray> - 은별 품질의 물고기를 노리는
  - <gray> - 낚시꾼에게 어울리는 낚싯대입니다.
  - ''
  - '<#FFD700>효과:'
  - <gray> - 은별 물고기 획득 확률 증가
golden_rod:
  material: FISHING_ROD
  Mechanics:
    durability:
      value: 80
  Pack:
    model: customfishing:item/rod/golden_rod
    cast_model: customfishing:item/rod/golden_rod_cast
    custom_model_data: 50003
  displayname: <b><#FFD700>황금 낚싯대
  lore:
  - ''
  - '<#7FFFD4>설명:'
  - <gray> - 고급스러운 분위기를 풍기는
  - <gray> - 상급 낚시 장비입니다.
  - ''
  - '<#FFD700>효과:'
  - <gray> - 금별 물고기 획득 확률 증가
star_rod:
  material: FISHING_ROD
  Mechanics:
    durability:
      value: 128
  Pack:
    model: customfishing:item/rod/star_rod
    cast_model: customfishing:item/rod/star_rod_cast
    custom_model_data: 50004
  displayname: <b><#FFFF00>별빛 낚싯대
  lore:
  - ''
  - '<#7FFFD4>설명:'
  - <gray> - 별가루와 우주의 기운이 깃든 낚싯대입니다.
  - <gray> - 충분한 시간을 확보해 완벽한 낚시를 돕습니다.
  - ''
  - '<#FFD700>효과:'
  - <gray> - +15초 게임 시간
bone_rod:
  material: FISHING_ROD
  Mechanics:
    durability:
      value: 32
  Pack:
    model: customfishing:item/rod/bone_rod
    cast_model: customfishing:item/rod/bone_rod_cast
    custom_model_data: 50005
  displayname: <b><#CD2626>뼈 낚싯대
  lore:
  - ''
  - '<#7FFFD4>설명:'
  - <gray> - 오래된 해골의 뼈와 어둠의 마법이 깃든
  - <gray> - 용감한 낚시꾼을 위한 낚싯대입니다.
  - <gray> - 일반 낚싯대의 한계를 넘어 용암에서도 낚시할 수 있습니다.
  - ''
  - '<#FFD700>효과:'
  - <gray> - 용암 낚시 가능
  - <gray> - 가끔 해골이 미끼를 물 수 있음
magical_rod:
  material: FISHING_ROD
  Mechanics:
    durability:
      value: 16
  Pack:
    model: customfishing:item/rod/magical_rod
    cast_model: customfishing:item/rod/magical_rod_cast
    custom_model_data: 50006
  displayname: <b><#7B68EE>마법 낚싯대
  lore:
  - ''
  - '<#7FFFD4>설명:'
  - <gray> - 마법책을 미끼로 사용하는 독특한 낚싯대입니다.
  - <gray> - 사용할 때마다 경험치 레벨을 소모합니다.
  - ''
  - '<#FFD700>효과:'
  - <gray> - 낚시로 마법이 부여된 책 획득 가능
  - <gray> - 입질까지 긴 시간이 필요함
  - ''
  - '<#CD5C5C>필요 조건:'
  - <gray> - 책 미끼 1개
  - <gray> - 경험치 레벨 10
