simple_bait:
  material: PAPER
  Pack:
    model: customfishing:item/bait/simple_bait
    custom_model_data: 50001
  displayname: <b><#00BFFF>간단한 미끼
  lore:
  - ''
  - '<#7FFFD4>설명:'
  - <gray>천연 재료로 만들어져 물고기를 차분하고 안정적으로 끌어들입니다.
  - <gray>간단하고 믿을 수 있는 낚시 경험에 적합합니다.
  - ''
  - '<#FFD700>효과:'
  - <gray> - 낚시 난이도 감소
magnetic_bait:
  material: PAPER
  Pack:
    model: customfishing:item/bait/magnetic_bait
    custom_model_data: 50002
  displayname: <b><red>자<blue>석 <gray>미끼
  lore:
  - ''
  - '<#7FFFD4>설명:'
  - <gray>빛나는 반짝임과 독특한 에너지 파동으로
  - <gray>호기심 많은 물고기를 빠르게 끌어들입니다.
  - ''
  - '<#FFD700>효과:'
  - <gray> - 입질 대기 시간 감소
  - <gray> - 낚시 게임 시간 증가
wild_bait:
  material: PAPER
  Pack:
    model: customfishing:item/bait/wild_bait
    custom_model_data: 50003
  displayname: <b><#2E8B57>야생 미끼
  lore:
  - ''
  - '<#7FFFD4>설명:'
  - '<gray>두려움 없는 낚시꾼을 위해 만들어진 미끼입니다.'
  - <gray>강력한 천연 재료의 향으로 큰 물고기를 유인합니다.
  - ''
  - '<#FFD700>효과:'
  - <gray> - 낚시 난이도 증가
  - <gray> - 잡히는 물고기 크기 증가
delicate_hook:
  material: SHEARS
  Pack:
    model: customfishing:item/hook/delicate_hook
    custom_model_data: 50000
  displayname: <#1E90FF>섬세한 낚싯바늘
  lore:
  - ''
  - '<#7FFFD4>설명:'
  - <gray> - 장인정신과 매력을 담은 낚싯바늘입니다.
  - <gray> - 정교하게 다듬어진 표면이 물속에서 빛나
  - <gray> - 고품질 물고기를 가까이 끌어들입니다.
  - ''
  - '<#FFD700>효과:'
  - <gray> - 고품질 물고기 획득 확률 증가
