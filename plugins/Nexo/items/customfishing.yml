  displayname: <b><#FFFF00>장인의 낚싯대
  lore:
  - ''
  - '<#7FFFD4>설명:'
  - <gray> - 숙련된 낚시꾼을 위한 정밀한 낚싯대입니다.
  - <gray> - 물고기가 미끼를 물기까지의 시간을 크게 줄입니다.
  - ''
  - '<#FFD700>효과:'
  - <gray> - 입질 대기 시간 감소
  - <gray> - 낚시 난이도 증가
  - <gray> - 고품질 물고기 획득 확률 증가
