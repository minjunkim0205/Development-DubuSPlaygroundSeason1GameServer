onion:
  type: BLOCK
  pot-whitelist:
    - default
  seed: onion_seeds
  random-rotation: true
  requirements:
    plant:
      requirement_1:
        type: season
        value:
          - Spring
          - Summer
          - Autumn
        not-met-actions:
          actionbar_action:
            type: actionbar
            value: <red><bold>[X] It's not a good season to plant onion
            # value: <red><bold>[X] 现在不是种植洋葱的好季节
  events:
    plant:
      action_1:
        type: sound
        value:
          source: player
          key: minecraft:item.hoe.till
          volume: 1
          pitch: 1
    break:
      action_1:
        type: sound
        value:
          source: player
          key: minecraft:block.crop.break
          volume: 1
          pitch: 1
  max-points: 2
  points:
    "0":
      model: onion_stage_1
      hologram-offset-correction: -0.3
    "1":
      model: onion_stage_2
      hologram-offset-correction: 0
    "2":
      model: onion_stage_3
      hologram-offset-correction: 0.1
      events:
        break:
          action_1:
            type: quality-crops
            value:
              min: 1
              max: 1
              items:
                "1": onion
                "2": onion_silver_star
                "3": onion_golden_star
          action_2:
            type: drop-item
            value:
              item: onion_seeds
              min: 1
              max: 2
            chance: 1
        interact:
          empty_hand_action:
            type: conditional
            value:
              conditions:
                requirement_empty_hand:
                  type: item-in-hand
                  value:
                    item: AIR
              actions:
                action_0:
                  type: swing-hand
                  value: true
                action_1:
                  type: break
                  value: true
  grow-conditions:
    default:
      point: 1
      conditions:
        condition_1:
          type: suitable-season
          value:
            - Spring
            - Summer
            - Autumn
        condition_2:
          type: water-more-than
          value: 0
  death-conditions:
    unsuitable_season:
      model: crop_stage_death
      conditions:
        condition_1:
          type: unsuitable-season
          value:
            - Winter
    crow_attack:
      conditions:
        condition_1:
          type: crow-attack
          value:
            chance: 0.01
            fly-model: crow_fly
            stand-model: crow_stand
      delay: 150
  custom-bone-meal:
    bone_meal_1:
      item: BONE_MEAL
      chance:
        "2": 0.2
        "1": 0.6
      actions:
        swing_action:
          type: swing-hand
          value: true
        particle_action:
          type: particle
          value:
            particle: VILLAGER_HAPPY
            count: 5
            x: 0.5
            y: 0.5
            z: 0.5
            offset-x: 0.3
            offset-y: 0.3
            offset-z: 0.3
        sound_action:
          type: sound
          value:
            key: minecraft:item.bone_meal.use
            source: player
            volume: 1
            pitch: 1
