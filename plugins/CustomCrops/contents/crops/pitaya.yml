pitaya:
  type: BLOCK
  pot-whitelist:
    - default
  seed: pitaya_seeds
  random-rotation: true
  events:
    plant:
      action_1:
        type: sound
        value:
          source: player
          key: minecraft:item.hoe.till
          volume: 1
          pitch: 1
    break:
      action_1:
        type: sound
        value:
          source: player
          key: minecraft:block.wood.break
          volume: 1
          pitch: 1
  max-points: 8
  points:
    "0":
      model: pitaya_stage_1
      hologram-offset-correction: -0.35
      events:
        break:
          action_1:
            type: drop-item
            value:
              item: STICK
              min: 1
              max: 1
            chance: 0.5
    "1":
      model: pitaya_stage_2
      hologram-offset-correction: 0
      events:
        break:
          action_1:
            type: drop-item
            value:
              item: STICK
              min: 1
              max: 1
            chance: 1
    "3":
      model: pitaya_stage_3
      hologram-offset-correction: 0.45
      events:
        break:
          action_1:
            type: drop-item
            value:
              item: STICK
              min: 1
              max: 2
            chance: 1
    "4":
      model: pitaya_stage_4
      hologram-offset-correction: 0.75
      events:
        break:
          action_1:
            type: drop-item
            value:
              item: DARK_OAK_LOG
              min: 1
              max: 1
            chance: 1
    "6":
      model: pitaya_stage_5
      hologram-offset-correction: 0.75
      events:
        break:
          action_1:
            type: sound
            value:
              source: player
              key: minecraft:block.wood.break
              volume: 1
              pitch: 1
          action_2:
            type: drop-item
            value:
              item: DARK_OAK_LOG
              min: 1
              max: 1
            chance: 1
    "8":
      model: pitaya_stage_6
      hologram-offset-correction: 0.75
      events:
        break:
          action_1:
            type: drop-item
            value:
              item: DARK_OAK_LOG
              min: 1
              max: 1
            chance: 1
          action_2:
            type: quality-crops
            value:
              min: 3
              max: 5
              items:
                "1": pitaya
                "2": pitaya_silver_star
                "3": pitaya_golden_star
          action_3:
            type: drop-item
            value:
              item: pitaya_seeds
              min: 1
              max: 2
            chance: 1
        interact:
          empty_hand_action:
            type: conditional
            value:
              conditions:
                requirement_empty_hand:
                  type: item-in-hand
                  value:
                    item: AIR
              actions:
                action_0:
                  type: swing-hand
                  value: true
                action_1:
                  type: break
                  value: false
                action_2:
                  type: plant
                  value:
                    point: 4
                    crop: pitaya
                action_3:
                  type: quality-crops
                  value:
                    min: 3
                    max: 5
                    items:
                      "1": pitaya
                      "2": pitaya_silver_star
                      "3": pitaya_golden_star
                action_4:
                  type: drop-item
                  value:
                    item: pitaya_seeds
                    min: 1
                    max: 1
                  chance: 0.5
  grow-conditions:
    default:
      point: 1
      conditions:
        condition_1:
          type: suitable-season
          value:
            - Spring
            - Summer
            - Autumn
        condition_2:
          type: water-more-than
          value: 0
  death-conditions:
    unsuitable_season:
      model: crop_stage_death
      conditions:
        condition_1:
          type: unsuitable-season
          value:
            - Winter
    crow_attack:
      conditions:
        condition_1:
          type: crow-attack
          value:
            chance: 0.01
            fly-model: crow_fly
            stand-model: crow_stand
      delay: 150
  custom-bone-meal:
    bone_meal_1:
      item: BONE_MEAL
      chance:
        "2": 0.2
        "1": 0.6
      actions:
        swing_action:
          type: swing-hand
          value: true
        particle_action:
          type: particle
          value:
            particle: VILLAGER_HAPPY
            count: 5
            x: 0.5
            y: 0.5
            z: 0.5
            offset-x: 0.3
            offset-y: 0.3
            offset-z: 0.3
        sound_action:
          type: sound
          value:
            key: minecraft:item.bone_meal.use
            source: player
            volume: 1
            pitch: 1
