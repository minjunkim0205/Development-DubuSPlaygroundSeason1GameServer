crimson_bracket_fungus:
  type: BLOCK
  pot-whitelist:
    - nether
  seed: crimson_bracket_fungus_seeds
  random-rotation: true
  requirements:
    plant:
      requirement_1:
        type: environment
        value:
          - nether
        not-met-actions:
          actionbar_action:
            type: actionbar
            value: <red><bold>[X] You can only plant it in the Nether.
            # value: <red><bold>[X] 你只能在下界维度种植它.
  events:
    plant:
      action_1:
        type: sound
        value:
          source: player
          key: minecraft:item.hoe.till
          volume: 1
          pitch: 1
    break:
      action_1:
        type: sound
        value:
          source: player
          key: minecraft:block.crop.break
          volume: 1
          pitch: 1
  max-points: 2
  points:
    "0":
      model: crimson_bracket_fungus_stage_1
      hologram-offset-correction: -0.2
    "1":
      model: crimson_bracket_fungus_stage_2
      hologram-offset-correction: 0.1
    "2":
      model: crimson_bracket_fungus_stage_3
      hologram-offset-correction: 0.15
      events:
        break:
          action_1:
            type: quality-crops
            value:
              min: 1
              max: 1
              items:
                "1": crimson_bracket_fungus
                "2": crimson_bracket_fungus_silver_star
                "3": crimson_bracket_fungus_golden_star
          action_2:
            type: drop-item
            value:
              item: crimson_bracket_fungus_seeds
              min: 1
              max: 2
            chance: 1
        interact:
          empty_hand_action:
            type: conditional
            value:
              conditions:
                requirement_empty_hand:
                  type: item-in-hand
                  value:
                    item: AIR
              actions:
                action_0:
                  type: swing-hand
                  value: true
                action_1:
                  type: break
                  value: true
  grow-conditions:
    default:
      point: 1
      conditions:
        condition_1:
          type: environment
          value:
            - nether
        condition_2:
          type: water-more-than
          value: 0
  death-conditions:
    no_dragon_breath:
      model: crop_stage_death
      conditions:
        "&&":
          condition_1:
            type: water-less-than
            value: 1
          condition_2:
            type: random
            value: 0.7
  custom-bone-meal:
    bone_meal_1:
      item: MAGMA_CREAM
      chance:
        "2": 0.2
        "1": 0.6
      actions:
        swing_action:
          type: swing-hand
          value: true
        particle_action:
          type: particle
          value:
            particle: VILLAGER_HAPPY
            count: 5
            x: 0.5
            y: 0.5
            z: 0.5
            offset-x: 0.3
            offset-y: 0.3
            offset-z: 0.3
        sound_action:
          type: sound
          value:
            key: minecraft:item.bone_meal.use
            source: player
            volume: 1
            pitch: 1
