default:
  max-water-storage: 5
  base:
    dry: dry_pot_1
    wet: wet_pot_1 
  absorb-rainwater: true
  absorb-nearby-water: false
  max-fertilizers: 1
  fertilized-pots:
    quality:
      dry: dry_pot_1
      wet: wet_pot_1
    yield_increase:
      dry: dry_pot_1
      wet: wet_pot_1
    variation:
      dry: dry_pot_1
      wet: wet_pot_1
    soil_retain:
      dry: dry_pot_1
      wet: wet_pot_1
    speed_grow:
      dry: dry_pot_1
      wet: wet_pot_1
  fill-method:
    method_1:
      item: WATER_BUCKET
      return: BUCKET
      amount: 3
      actions:
        sound_action:
          type: sound
          value:
            source: player
            key: minecraft:item.bucket.fill
            volume: 1
            pitch: 1
        swing_hand_action:
          type: swing-hand
          value: true
    method_2:
      item: POTION
      return: GLASS_BOTTLE
      amount: 1
      actions:
        sound_action:
          type: sound
          value:
            source: player
            key: minecraft:item.bottle.fill
            volume: 1
            pitch: 1
        swing_hand_action:
          type: swing-hand
          value: true
  water-bar:
    left: '뀂'   
    full: '뀁뀃' 
    empty: '뀁뀆'
    right: '뀁뀇'
  events:
    add_water:
      particle_action:
        type: particle
        value:
          particle: WATER_SPLASH  
          x: 0.5
          y: 1.3
          z: 0.5
          count: 5
          offset-x: 0.3
          offset-z: 0.3
    interact:
      conditional_action:
        type: conditional
        value:
          conditions:
            requirement_1:
              type: item-in-hand
              value:
                amount: 1
                item: soil_surveyor
          actions:
            conditional_fertilizer_action:
              type: conditional
              value:
                conditions:
                  requirement_1:
                    type: fertilizer
                    value:
                      has: true
                actions:
                  fertilizer_hologram:
                    type: hologram
                    value:
                      duration: 20  
                      text: '<font:minecraft:customcrops>{icon}</font>{left_times}/{max_times}'
                      apply-correction: true
                      x: 0.5
                      y: 0.83
                      z: 0.5
                      visible-to-all: false
            water_hologram:
              type: hologram
              value:
                duration: 20  
                text: '<font:minecraft:customcrops>{water_bar}</font>'
                apply-correction: true
                x: 0.5
                y: 0.6
                z: 0.5
                visible-to-all: false